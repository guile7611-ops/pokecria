<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efeitos de ataque · Aurora</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#182735;color:#eff8f2;font-family:system-ui,sans-serif;padding:30px}main{max-width:1050px;margin:auto}h1{font-size:1.7rem}p{color:#c0d2da;line-height:1.5}a{color:#8be6ff}input,select{background:#10212e;color:white;border:2px solid #668a98;padding:12px;font:inherit}input{width:min(100%,420px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:25px 0}.card{background:#243a48;border:2px solid #587481;padding:12px;min-height:195px}.view{height:105px;display:grid;place-items:center;background:#152532;image-rendering:pixelated}.sprite{width:64px;height:64px;background-repeat:no-repeat;image-rendering:pixelated;transform:scale(1.35);animation:play .8s steps(8) infinite}.view:has(.sprite+.sprite){position:relative}.view .sprite+.sprite{position:absolute;left:calc(50% - 32px);top:calc(50% - 32px)}@keyframes play{to{background-position-x:-512px}}strong{display:block;margin-top:12px}small{color:#a8c3c8}.card .power{display:block;font-weight:800;color:#f2dc90;margin:7px 0 3px}
</style></head><body><main><h1>Efeitos de Mystery Dungeon em Aurora</h1><p>Quadros originais extraídos de <a href="https://www.spriters-resource.com/ds_dsi/pokemonmysterydungeonexplorersofsky/asset/85692/">Attack Effects — Pokémon Mystery Dungeon: Explorers of Sky</a>. Os IDs não vêm associados a nomes de golpes no pacote; estas associações foram escolhidas pela aparência. <a href="/">Voltar ao jogo</a>.</p><p id="count"></p><label>Buscar golpe <input id="search" type="search" placeholder="Nome do ataque"></label> <label>Tipo <select id="type"><option value="Water">Água</option><option value="Grass">Planta</option><option value="Fire">Fogo</option><option value="all">Todos</option></select></label><div class="grid" id="gallery"></div></main>
<script type="module">
import{ABILITIES}from './data.js';
import{PMD_MOVE_SPRITES}from './pmd-attack-vfx.js';
import{baseDamageLabel}from './move-info.js';
const gallery=document.querySelector('#gallery');
for(const move of Object.values(ABILITIES).filter(move=>move.id!=='basic')){const id=PMD_MOVE_SPRITES[move.id],card=document.createElement('article');card.className='card';card.dataset.name=`${move.name} ${move.id}`.toLocaleLowerCase('pt-BR');card.dataset.type=move.type||'Normal';const view=document.createElement('div');view.className='view';const sprite=document.createElement('div');sprite.className='sprite';sprite.style.backgroundImage=`url('/assets/sprites/vfx/${move.vfx}.png')`;sprite.style.animationDelay=`-${(Number(id||0)%8)*.1}s`;view.append(sprite);if(move.id==='flameWheel'){const wheel=document.createElement('div');wheel.className='sprite';wheel.style.backgroundImage="url('/assets/sprites/vfx/moves/flameWheel.png')";view.append(wheel)}const title=document.createElement('strong');title.textContent=move.name;const power=document.createElement('small');power.className='power';power.textContent=baseDamageLabel(move);const label=document.createElement('small');label.textContent=id?`Mystery Dungeon · #${id}${move.id==='flameWheel'?' + roda própria':''}`:'Arte própria · Aurora';card.append(view,title,power,label);gallery.append(card)}
const search=document.querySelector('#search'),type=document.querySelector('#type'),count=document.querySelector('#count');
const requested=new URLSearchParams(location.search).get('type');if([...type.options].some(option=>option.value===requested))type.value=requested;
function filter(){const term=search.value.trim().toLocaleLowerCase('pt-BR');let visible=0;for(const card of gallery.children){card.hidden=!(card.dataset.name.includes(term)&&(type.value==='all'||card.dataset.type===type.value));if(!card.hidden)visible++}count.textContent=`${visible} golpes exibidos · ${Object.keys(PMD_MOVE_SPRITES).length} golpes com efeitos importados no catálogo`}
search.addEventListener('input',filter);type.addEventListener('change',filter);filter();
</script></body></html>
