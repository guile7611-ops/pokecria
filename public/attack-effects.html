<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efeitos de ataque · Aurora</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#182735;color:#eff8f2;font-family:system-ui,sans-serif;padding:30px}main{max-width:1280px;margin:auto}h1{font-size:1.7rem}p{color:#c0d2da;line-height:1.5}a{color:#8be6ff}input,select{background:#10212e;color:white;border:2px solid #668a98;padding:12px;font:inherit}input{width:min(100%,420px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:14px;margin:25px 0}.card{background:#243a48;border:2px solid #587481;padding:12px;min-height:225px}.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.view{height:82px;display:grid;place-items:center;background:#152532;image-rendering:pixelated;overflow:hidden}.view span{align-self:end;font-size:9px;letter-spacing:.08em;color:#9db7c2}.sprite{width:64px;height:64px;background-repeat:no-repeat;image-rendering:pixelated;transform:scale(1.05);animation:play .8s steps(8) infinite}.card[data-id="earthquake"] .sprite{transform:scale(2.2)}.view .sprite+span{margin-top:-13px;z-index:2;background:#10212ecc;padding:1px 3px}@keyframes play{to{background-position-x:-512px}}strong{display:block;margin-top:12px}small{color:#a8c3c8}.card .power{display:block;font-weight:800;color:#f2dc90;margin:7px 0 3px}
</style></head><body><main><h1>Catálogo visual de golpes de Aurora</h1><p>Prévia das três fases usadas pela engine: conjuração, trajetória e impacto. O catálogo combina efeitos PMD compatíveis com folhas próprias geradas para cada golpe. <a href="/">Voltar ao jogo</a>.</p><p id="count"></p><label>Buscar golpe <input id="search" type="search" placeholder="Nome do ataque"></label> <label>Tipo <select id="type"><option value="all">Todos</option></select></label><div class="grid" id="gallery"></div></main>
<script type="module">
import{ABILITIES}from './data.js';
import{PMD_MOVE_SPRITES}from './pmd-attack-vfx.js';
import{animationProfileFor,moveAnimationVisual}from './move-animation-profiles.js';
import{EXTERNAL_MOVE_VFX}from './external-move-vfx.js';
import{baseDamageLabel}from './move-info.js';
const gallery=document.querySelector('#gallery'),search=document.querySelector('#search'),type=document.querySelector('#type'),count=document.querySelector('#count');
const moves=Object.values(ABILITIES).filter(move=>move.id!=='basic');for(const value of [...new Set(moves.map(move=>move.type||'Normal'))].sort())type.insertAdjacentHTML('beforeend',`<option value="${value}">${value}</option>`);type.value='all';
for(const move of moves){const id=PMD_MOVE_SPRITES[move.id],visual=moveAnimationVisual(move),profile=animationProfileFor(move),card=document.createElement('article');card.className='card';card.dataset.id=move.id;card.dataset.name=`${move.name} ${move.officialMove||''} ${move.id}`.toLocaleLowerCase('pt-BR');card.dataset.type=move.type||'Normal';const phases=document.createElement('div');phases.className='phases';for(const [phase,label] of [['cast','CONJURA'],['travel','TRAJETO'],['impact','IMPACTO']]){const view=document.createElement('div');view.className='view';const sprite=document.createElement('div');sprite.className=`sprite ${phase}`;sprite.style.backgroundImage=`url('/assets/sprites/vfx/${visual[phase]}.png')`;sprite.style.animationDelay=`-${(Number(id||move.id.length)%8)*.1}s`;const caption=document.createElement('span');caption.textContent=label;view.append(sprite,caption);phases.append(view)}const title=document.createElement('strong');title.textContent=move.name;const power=document.createElement('small');power.className='power';power.textContent=baseDamageLabel(move);const label=document.createElement('small');label.textContent=`${move.type||'Normal'} · ${move.behavior||'direct'} · ${profile.motif} · ${profile.source==='gen3'?'Gen 3 original':profile.source==='ebdx'?'EBDX original':id?`PMD #${id}`:'Aurora'}`;card.append(phases,title,power,label);gallery.append(card)}
const requested=new URLSearchParams(location.search).get('type');if([...type.options].some(option=>option.value===requested))type.value=requested;
function filter(){const term=search.value.trim().toLocaleLowerCase('pt-BR');let visible=0;for(const card of gallery.children){card.hidden=!(card.dataset.name.includes(term)&&(type.value==='all'||card.dataset.type===type.value));if(!card.hidden)visible++}count.textContent=`${visible} golpes exibidos · ${Object.keys(EXTERNAL_MOVE_VFX).length} recursos externos exatos · ${Object.keys(PMD_MOVE_SPRITES).filter(id=>!EXTERNAL_MOVE_VFX[id]).length} PMD preservados`}
search.addEventListener('input',filter);type.addEventListener('change',filter);filter();
</script></body></html>
